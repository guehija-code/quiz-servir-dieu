<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Servir Dieu — en direct</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Literata:ital,wght@0,500;1,400&display=swap">
<style>
/* VOICE: festif mais recueilli, une salle d'église qui joue ensemble.
   IDEA: une lampe qu'on ranime (2 Tim 1:6) : chaque bonne réponse attise la flamme.
   PICTURE: l'écran de jeu lui-même, quatre grandes tuiles et un compte à rebours en flamme.
   COLOUR and TYPE: nuit profonde #0f1b33, or de lampe #e8b23a, tuiles corail, turquoise, violet, vert-olive ; Sora + Literata pour les versets.
   LAYOUT: une colonne centrée, grand écran pour l'animateur, gros boutons pour le téléphone. */
:root{color-scheme:dark;--bg:#0f1b33;--bg2:#172748;--ink:#f3eee2;--soft:#b9c3d8;--gold:#e8b23a;--a:#e2574c;--b:#1e9e93;--c:#7a5cc7;--d:#5d8a2e;--line:#2a3d66}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#24396a 0,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
main{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,40px) max(4vw,14px) 60px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 10px;text-wrap:balance;font-weight:800}
h2{font-size:clamp(22px,3.4vw,40px);line-height:1.12;margin:0 0 18px;text-wrap:balance;font-weight:800}
p{margin:0 0 12px}.soft{color:var(--soft)}.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:14px;color:var(--soft)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 22px;min-height:48px;font:600 17px Sora,sans-serif;cursor:pointer;background:var(--gold);color:#1b1404}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,32px)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
.lamp{width:100%;max-width:360px;justify-self:center}
.choices{display:grid;gap:14px;margin-top:20px}
.choice{text-align:left}
input{font:16px Sora,sans-serif;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#0b1428;color:var(--ink);width:100%;min-height:48px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.timer{height:12px;border-radius:99px;background:#0b1428;overflow:hidden;margin:6px 0 22px}
.timer>i{display:block;height:100%;background:linear-gradient(90deg,#f5d27a,var(--gold),#e2574c);transform-origin:left;transition:transform .25s linear}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{display:flex;align-items:center;gap:14px;border:0;border-radius:16px;padding:18px;min-height:86px;color:#fff;font:600 clamp(16px,2.2vw,22px)/1.25 Sora,sans-serif;text-align:left;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22)}
.tile b{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);font-size:20px}
.t0{background:var(--a)}.t1{background:var(--b)}.t2{background:var(--c)}.t3{background:var(--d)}
.tile.dim{opacity:.28}.tile.ok{outline:4px solid #fff}
.tile:disabled{cursor:default}
.verse{font-family:Literata,Georgia,serif;font-style:italic;font-size:clamp(17px,2vw,21px);color:#f6e6bd;border-left:4px solid var(--gold);padding:6px 0 6px 16px;margin:18px 0}
.big{font-size:clamp(44px,8vw,96px);font-weight:800;line-height:1;color:var(--gold)}
.board{display:grid;gap:8px;margin-top:10px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:#0b1428;border-radius:12px;padding:10px 14px}
.brow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .s{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold)}
.brow.me{outline:2px solid var(--gold)}
.dist{display:grid;gap:8px;margin-top:14px}
.dbar{display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:15px}
.dbar span{height:22px;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#0b1428;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:15px}
.feedback{font-size:clamp(28px,5vw,44px);font-weight:800}
.good{color:#8fe3a2}.bad{color:#ff9d93}
.note{font-size:14px;color:var(--soft);border-top:1px solid var(--line);margin-top:22px;padding-top:12px}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.07) translateY(-2px)}}
.flame{transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.flame{animation:none}.timer>i{transition:none}}
@media(max-width:700px){.hero{grid-template-columns:1fr}.lamp{max-width:220px;order:-1}.tiles{grid-template-columns:1fr}.tile{min-height:70px}}

.code{font-size:clamp(48px,9vw,110px);font-weight:800;letter-spacing:.12em;color:var(--gold);line-height:1}
.qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;margin-top:10px}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.url{word-break:break-all;font-size:15px;color:var(--soft)}
.err{color:#ff9d93}
.modal{position:fixed;inset:0;background:rgba(5,10,22,.72);display:grid;place-items:center;padding:16px;z-index:10}.modal .card{max-width:520px;width:100%}
.hrow{width:100%;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}.hrow:hover{outline:2px solid var(--line)}.hq{display:grid;gap:4px;margin-bottom:6px}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main id="app"><div class="card"><h1>Servir Dieu sans négligence</h1><p class="soft">Chargement…</p></div></main>
<script>
{
const Q=[
 {q:"1 Pierre 4:10 : que désigne le mot « dispensateurs » (grec oikonomos) ?",a:["Des prophètes de l'avenir","Des intendants de la maison du maître","Des prêtres du temple","Des propriétaires des biens"],c:1,t:30,v:"L'intendant ne possède rien : il gère ce qui appartient à son maître et lui rendra des comptes. La King James dit « good stewards »."},
 {q:"Genèse 2:15 : le verbe hébreu « avad » (cultiver) signifie aussi…",a:["Servir","Posséder","Se reposer","Conquérir"],c:0,t:20,v:"Même racine que « eved », le serviteur. Cultiver le jardin, c'était déjà servir."},
 {q:"Quand l'homme a-t-il reçu son premier mandat de service ?",a:["Après la chute","Au déluge","Avant la chute, en Éden","Au mont Sinaï"],c:2,t:20,v:"Le service n'est pas une punition : il fait partie de notre vocation d'origine (Genèse 2:15, 19)."},
 {q:"Exode 4:12 : que répond Dieu à Moïse qui se dit incapable de parler ?",a:["« Retourne garder tes brebis »","« Attends d'être prêt »","« Tu n'auras rien à dire »","« Je serai avec ta bouche »"],c:3,t:30,v:"« Va donc, je serai avec ta bouche. » Dieu qualifie ceux qu'il appelle : « Notre capacité vient de Dieu » (2 Corinthiens 3:5)."},
 {q:"Le grec « charisma » (don) vient de « charis », qui signifie…",a:["La force","La grâce","La sagesse","La récompense"],c:1,t:20,v:"Un don n'est pas une médaille, c'est une grâce pour servir (1 Corinthiens 12:4-7)."},
 {q:"Exode 31 : Betsaleel est rempli de l'Esprit de Dieu pour…",a:["Construire le tabernacle","Prêcher au peuple","Diriger l'armée","Expliquer les songes"],c:0,t:20,v:"Il n'est pas équipé pour prêcher mais pour construire : savoir-faire et créativité servent Dieu."},
 {q:"1 Corinthiens 12:18 : qui a placé chaque membre dans le corps ?",a:["Chacun, selon son choix","Les anciens de l'Église","Dieu, comme il a voulu","Les apôtres"],c:2,t:20,v:"« Dieu a placé chacun des membres dans le corps comme il a voulu. » Les membres qui paraissent faibles sont nécessaires (12:22)."},
 {q:"Matthieu 25 : pourquoi le 3e serviteur a-t-il enterré son talent ?",a:["Il l'avait prêté","Il l'avait dépensé","Il l'avait perdu","Il a eu peur"],c:3,t:20,v:"Il n'a rien volé ni gaspillé, mais il n'a rien fait. « Celui qui sait faire ce qui est bien, et qui ne le fait pas, commet un péché » (Jacques 4:17)."},
 {q:"2 Timothée 1:6 : « ranimer le don » évoque l'image de…",a:["Raviver un feu","Arroser une plante","Réveiller un dormeur","Polir une pierre"],c:0,t:20,v:"Anazôpureô : ana (de nouveau) + zôos (vivant) + pur (feu). Rendre au feu sa vie. KJV : « stir up the gift of God »."},
 {q:"Qui a dit : « Moi et ma maison, nous servirons l'Éternel » ?",a:["Moïse","Josué","David","Abraham"],c:1,t:20,v:"Josué 24:15. Le service découle de ce que nous sommes, pas d'un titre."}
];
const L=["A","B","C","D"],PREFIX="servirdieu-quiz-";
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pts=(qi,ans)=>{if(!ans)return 0;const [ch,ms]=ans;if(ch!==Q[qi].c)return 0;const lim=Q[qi].t*1000;return Math.round(500+500*Math.max(0,1-Math.min(ms,lim)/lim));};
const total=a=>Object.keys(a||{}).reduce((s,k)=>s+pts(+k,a[k]),0);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const lamp=`<svg class="lamp" viewBox="0 0 300 240" aria-label="Une lampe à huile allumée"><defs><radialGradient id="g" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#ffd978" stop-opacity=".55"/><stop offset="1" stop-color="#ffd978" stop-opacity="0"/></radialGradient><linearGradient id="f" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2574c"/><stop offset=".5" stop-color="#e8b23a"/><stop offset="1" stop-color="#fff2c4"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a3a"/><stop offset="1" stop-color="#7a4a1c"/></linearGradient></defs><circle cx="150" cy="95" r="95" fill="url(#g)"/><ellipse cx="150" cy="222" rx="110" ry="10" fill="#0a1224"/><path class="flame" d="M150 40c18 26 24 44 14 62-6 10-22 12-30 2-10-12-6-30 16-64z" fill="url(#f)"/><path d="M60 170c0-24 40-40 90-40 34 0 62 6 80 16l40-6c-10 18-28 30-46 36-16 20-46 34-74 34-50 0-90-16-90-40z" fill="url(#l)"/><path d="M78 168c14 10 40 16 72 16s56-6 70-14" stroke="#f3c77a" stroke-width="3" fill="none" opacity=".55"/><rect x="141" y="112" width="18" height="22" rx="4" fill="#5a3412"/></svg>`;
const isPhone=matchMedia('(max-width:820px)').matches||/Android|iPhone|iPad/i.test(navigator.userAgent);
const params=new URLSearchParams(location.search);
let view='intro',tick=null;
function shell(inner,tag){app.innerHTML=`<div class="top"><div class="brand">✦ Étude biblique · Quiz en direct</div><span class="pill" id="status">${esc(tag||'')}</span></div>${inner}`;}
function setStatus(t){const s=document.getElementById('status');if(s)s.textContent=t;}
function tilesHTML(qi,o){return `<div class="tiles">${Q[qi].a.map((x,i)=>`<button class="tile t${i} ${o.cls?o.cls(i):''}" data-i="${i}" ${o.disabled?'disabled':''}><b>${L[i]}</b><span>${esc(x)}</span></button>`).join('')}</div>`;}
function timerRun(sec,t0,onEnd){clearInterval(tick);const upd=()=>{const left=Math.max(0,sec*1000-(Date.now()-t0));const b=document.getElementById('bar');if(b)b.style.transform=`scaleX(${left/(sec*1000)})`;const n=document.getElementById('secs');if(n)n.textContent=Math.ceil(left/1000)+' s';if(left<=0){clearInterval(tick);onEnd&&onEnd();}};upd();tick=setInterval(upd,250);}
function boardHTML(rows,me){if(!rows.length)return `<p class="soft">Personne n'a encore marqué de points.</p>`;return `<div class="board">${rows.slice(0,10).map((r,i)=>`<div class="brow ${me&&r.n===me?'me':''}"><b>${i+1}</b><span class="n">${esc(r.n)}</span><span class="s">${r.s} pts</span></div>`).join('')}</div>`;}
const rk=n=>n+(n===1?'er':'e');

function intro(){
  view='intro';clearInterval(tick);
  shell(`<div class="card hero"><div><h1>Servir Dieu sans négligence</h1><p class="soft">10 questions tirées de l'exhortation. L'animateur projette le jeu depuis un ordinateur ; les participants répondent avec leur téléphone, sans compte ni application.</p><div class="row" style="margin-top:20px">${isAdmin?`<button class="btn" id="ho">J'anime (ordinateur)</button><button class="btn ghost" id="hist">Historique</button><button class="btn ghost" id="pl">Je participe</button><button class="btn ghost" id="lo">Quitter le mode animateur</button>`:`<button class="btn" id="pl">Je participe</button>`}</div></div>${lamp}</div>`,isAdmin?'Animateur reconnu':'Accueil');
  document.getElementById('pl').onclick=()=>joinForm();
  if(isAdmin){document.getElementById('ho').onclick=hostStart;document.getElementById('hist').onclick=()=>showHistory(intro);document.getElementById('lo').onclick=()=>{isAdmin=false;try{localStorage.removeItem('quizadmin')}catch(e){}intro();};}
}
/* Accès animateur : réservé au détenteur de la clé (seule son empreinte SHA-256 est dans ce fichier). */
const ADMIN_HASH="1337816538b8f887d96f53bafa27ce45d33224bd8bfe5cf17acea78f7b21412d";
let isAdmin=false;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function checkAdmin(){
  let k=params.get('admin');let saved=null;try{saved=localStorage.getItem('quizadmin')}catch(e){}
  if(!k&&saved)k=saved;if(!k)return false;
  try{if(await sha(k)===ADMIN_HASH){try{localStorage.setItem('quizadmin',k)}catch(e){}if(params.get('admin')){history.replaceState(null,'',location.pathname);}return true;}}catch(e){}
  return false;
}

/* ================= ANIMATEUR ================= */
let hpeer=null,code='',players={},live={phase:'lobby',q:-1,startedAt:0},revealT=null;
function hostStart(){if(!isAdmin){intro();return;}view='host';players={};live={phase:'lobby',q:-1,startedAt:0};gameId=Date.now();try{hpeer&&hpeer.destroy();}catch(e){}code=String(Math.floor(1000+Math.random()*9000));shell(`<div class="card"><h2>Ouverture de la salle…</h2><p class="soft">Connexion au relais en cours.</p></div>`,'Animateur');
  try{hpeer=new Peer(PREFIX+code,{debug:1,...ICE});}catch(e){shell(`<div class="card"><h2 class="err">Connexion impossible</h2><p>La bibliothèque de connexion n'a pas pu se charger. Vérifiez la connexion Internet de l'ordinateur.</p></div>`,'Animateur');return;}
  hpeer.on('open',()=>hostRender());
  hpeer.on('error',e=>{if(e.type==='unavailable-id'){hpeer.destroy();hostStart();}else setStatus('Erreur : '+e.type);});
  hpeer.on('disconnected',()=>{setStatus('Reconnexion…');try{hpeer.reconnect();}catch(e){}});
  hpeer.on('connection',conn=>{
    conn.on('data',d=>hostData(conn,d));
    conn.on('close',()=>{for(const k in players)if(players[k].conn===conn){players[k].conn=null;players[k].goneAt=Date.now();}hostLive();});
    conn.on('error',()=>{});
  });
}
function hostData(conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='hello'){let n=String(d.n||'').trim().slice(0,20);if(!n)return;const id=String(d.id||n).slice(0,40);let p=players[id];
    if(!p){const taken=new Set(Object.values(players).map(x=>x.n));let base=n,k=2;while(taken.has(n)){n=base.slice(0,17)+' '+k;k++;}p={n,a:{}};players[id]=p;}
    if(p.conn&&p.conn!==conn){try{p.conn.close();}catch(e){}}p.conn=conn;p.goneAt=0;conn._pid=id;send(conn,stateFor(p));hostLive();return;}
  if(d.t==='ping'){const p=players[conn._pid];if(p)send(conn,stateFor(p));return;}
  if(d.t==='ans'){const p=players[conn._pid];if(!p)return;
    if(live.phase==='question'&&+d.q===live.q&&!p.a[live.q]){const ch=+d.c,ms=+d.ms;if(ch>=0&&ch<4&&isFinite(ms)){p.a[live.q]=[ch,Math.max(0,Math.min(ms,Q[live.q].t*1000))];hostLive();
      if(Object.values(players).every(x=>x.a[live.q]||(!(x.conn&&x.conn.open)&&x.goneAt&&Date.now()-x.goneAt>15000)))setTimeout(reveal,800);}}
    send(conn,stateFor(p));}
}
function send(conn,msg){try{if(conn&&conn.open)conn.send(msg);}catch(e){}}
function rows(){return Object.values(players).map(p=>({n:p.n,s:total(p.a)})).sort((x,y)=>y.s-x.s);}
function stateFor(p){const r=rows();const pos=r.findIndex(x=>x.n===p.n)+1;return {t:'state',name:p.n,phase:live.phase,q:live.q,mine:p.a[live.q]||null,score:total(p.a),rank:pos||null,count:r.length,top:r.slice(0,3)};}
function broadcast(){for(const p of Object.values(players))send(p.conn,stateFor(p));}
function joinURL(){const u=new URL(location.href);u.search='?code='+code;u.hash='';return u.toString();}
let gameId=Date.now();
function setLive(l){live=l;broadcast();hostRender();}
function nextQ(){clearTimeout(revealT);const q=live.q+1;if(q>=Q.length){setLive({phase:'end',q:Q.length-1,startedAt:0});saveHistory('terminée');return;}
  for(const p of Object.values(players))delete p.a[q];
  setLive({phase:'question',q,startedAt:Date.now()});revealT=setTimeout(reveal,Q[q].t*1000+1500);}
function reveal(){if(live.phase!=='question')return;clearTimeout(revealT);setLive({...live,phase:'reveal'});saveHistory('en cours');}
function prevStep(){clearTimeout(revealT);const q=live.q;
  if(live.phase==='end'){setLive({phase:'reveal',q:Q.length-1,startedAt:0});return;}
  if(live.phase==='question'){for(const p of Object.values(players))delete p.a[q];}
  if(q<=0){setLive({phase:'lobby',q:-1,startedAt:0});return;}
  setLive({phase:'reveal',q:q-1,startedAt:0});}
function anyAnswer(){return Object.values(players).some(p=>Object.keys(p.a).length);}
function restartGame(){clearTimeout(revealT);if(anyAnswer()&&live.phase!=='end')saveHistory('interrompue');for(const p of Object.values(players))p.a={};gameId=Date.now();setLive({phase:'lobby',q:-1,startedAt:0});}
function quitGame(){clearTimeout(revealT);if(anyAnswer()&&live.phase!=='end')saveHistory('interrompue');
  for(const p of Object.values(players))send(p.conn,{t:'state',phase:'closed',q:-1,score:total(p.a)});
  setTimeout(()=>{try{hpeer&&hpeer.destroy();}catch(e){}hpeer=null;players={};live={phase:'lobby',q:-1,startedAt:0};},400);intro();}
function askConfirm(msg,yes,onYes){const box=document.createElement('div');box.className='modal';box.innerHTML=`<div class="card"><h2>${esc(msg)}</h2><div class="row" style="margin-top:16px"><button class="btn" id="cy">${esc(yes)}</button><button class="btn ghost" id="cn">Annuler</button></div></div>`;document.body.appendChild(box);box.querySelector('#cn').onclick=()=>box.remove();box.querySelector('#cy').onclick=()=>{box.remove();onYes();};box.querySelector('#cy').focus();}
function navHTML(main){return `<div class="row" style="margin-top:18px">${main||''}<button class="btn ghost" id="pv">← Précédent</button><button class="btn ghost" id="rs">Recommencer</button><button class="btn ghost" id="qt">Quitter</button></div>`;}
function bindNav(){const pv=document.getElementById('pv');if(pv)pv.onclick=prevStep;
  const rs=document.getElementById('rs');if(rs)rs.onclick=()=>askConfirm('Recommencer la partie depuis le début ?','Recommencer',restartGame);
  const qt=document.getElementById('qt');if(qt)qt.onclick=()=>askConfirm('Quitter la partie ? Les participants seront déconnectés.','Quitter',quitGame);}

/* ----- Historique des sessions (gardé sur cet ordinateur) ----- */
const HKEY='quizhistory';
function loadHist(){const h=store.get(HKEY);return Array.isArray(h)?h:[];}
function saveHistory(status){
  const r=rows();if(!r.length)return;
  const last=live.phase==='end'?Q.length-1:(live.phase==='question'?live.q-1:live.q);
  const perQ=[];for(let i=0;i<=last;i++){let ok=0,ans=0;for(const p of Object.values(players)){const x=p.a[i];if(x){ans++;if(x[0]===Q[i].c)ok++;}}perQ.push({ok,ans});}
  const rec={id:gameId,date:new Date(gameId).toISOString(),end:new Date().toISOString(),code,status,n:r.length,asked:last+1,rows:r.slice(0,100),perQ};
  const h=loadHist().filter(x=>x.id!==gameId);h.unshift(rec);store.set(HKEY,h.slice(0,60));}
const fmtD=iso=>{try{return new Date(iso).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}};
let histBack=null;
function showHistory(back){histBack=back||histBack||intro;view='hist';clearInterval(tick);const h=loadHist();
  shell(`<div class="card"><div class="qhead"><h2 style="margin:0">Historique des sessions</h2><button class="btn ghost" id="hb">← Retour</button></div>${h.length?`<div class="board">${h.map((x,i)=>`<button class="brow hrow" data-i="${i}"><b>${i+1}</b><span class="n">${esc(fmtD(x.date))} · ${x.n} participant${x.n>1?'s':''} · ${x.asked}/${Q.length} questions<br><span class="soft small">Vainqueur : ${esc(x.rows[0]?x.rows[0].n:'—')} (${x.rows[0]?x.rows[0].s:0} pts) · code ${esc(x.code)}</span></span><span class="s">${esc(x.status)}</span></button>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn ghost" id="hclr">Tout effacer</button></div>`:`<p class="soft">Aucune session enregistrée sur cet ordinateur pour l'instant. Chaque partie s'y ajoute automatiquement.</p>`}<p class="note">L'historique est conservé dans le navigateur de cet ordinateur.</p></div>`,'Animateur');
  document.getElementById('hb').onclick=()=>{const b=histBack;histBack=null;b();};
  app.querySelectorAll('.hrow').forEach(b=>b.onclick=()=>showSession(+b.dataset.i));
  const c=document.getElementById('hclr');if(c)c.onclick=()=>askConfirm("Effacer tout l'historique ?",'Effacer',()=>{store.set(HKEY,[]);showHistory();});}
function showSession(i){const x=loadHist()[i];if(!x){showHistory();return;}
  shell(`<div class="card"><div class="qhead"><h2 style="margin:0">Session du ${esc(fmtD(x.date))}</h2><button class="btn ghost" id="hb">← Historique</button></div><p class="soft">${x.n} participant${x.n>1?'s':''} · ${x.asked}/${Q.length} questions · ${esc(x.status)} · code ${esc(x.code)}</p><h2 style="margin-top:18px">Classement</h2>${boardHTML(x.rows)}<h2 style="margin-top:22px">Réussite par question</h2><div class="dist">${(x.perQ||[]).map((r,k)=>{const pc=r.ans?Math.round(r.ok/r.ans*100):0;return `<div class="hq"><span class="small">Q${k+1}. ${esc(Q[k]?Q[k].q:'')}</span><div class="dbar"><b>${pc}%</b><span style="width:${Math.max(2,pc)}%;background:var(--gold)"></span><span class="small">${r.ok}/${r.ans}</span></div></div>`}).join('')}</div><div class="row" style="margin-top:18px"><button class="btn ghost" id="hdel">Supprimer cette session</button></div></div>`,'Animateur');
  document.getElementById('hb').onclick=()=>showHistory();
  document.getElementById('hdel').onclick=()=>askConfirm('Supprimer cette session ?','Supprimer',()=>{store.set(HKEY,loadHist().filter(y=>y.id!==x.id));showHistory();});}
function backToHost(){view='host';hostRender();}

function hostLive(){
  if(view!=='host')return;
  const names=Object.values(players);
  if(live.phase==='lobby'){const c=document.getElementById('cnt');if(c){c.textContent=names.length;document.getElementById('chips').innerHTML=names.map(p=>`<span class="chip" style="${p.conn?'':'opacity:.4'}">${esc(p.n)}</span>`).join('');}}
  if(live.phase==='question'){const a=document.getElementById('ans');if(a)a.textContent=names.filter(p=>p.a[live.q]).length+' / '+names.length+' réponses';}
}
function hostRender(){
  if(view!=='host')return;clearInterval(tick);
  const ph=live.phase,names=Object.values(players);
  if(ph==='lobby'){
    shell(`<div class="card hero"><div><p class="soft">Code de la partie</p><p class="code">${code}</p><p style="margin-top:14px">Sur votre téléphone, scannez le QR code ou ouvrez :</p><p class="url">${esc(joinURL())}</p><div class="qr" id="qr"></div></div><div><p class="big" id="cnt">${names.length}</p><p>participant(s) connecté(s)</p><div class="chips" id="chips"></div><div class="row" style="margin-top:22px"><button class="btn" id="go">Lancer la première question</button><button class="btn ghost" id="hi">Historique</button><button class="btn ghost" id="qt">Quitter</button></div><p class="note">Gardez cette page ouverte pendant tout le jeu : la fermer met fin à la partie.</p></div></div>`,'Animateur');
    try{new QRCode(document.getElementById('qr'),{text:joinURL(),width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){const q=document.getElementById('qr');if(q)q.remove();}
    hostLive();document.getElementById('go').onclick=nextQ;document.getElementById('hi').onclick=()=>showHistory(backToHost);bindNav();return;}
  if(ph==='question'){const i=live.q;
    shell(`<div class="card"><div class="qhead"><span class="pill">Question ${i+1} / ${Q.length}</span><span class="pill" id="secs"></span><span class="pill" id="ans"></span><span class="pill">Code ${code}</span></div><h2>${esc(Q[i].q)}</h2><div class="timer"><i id="bar"></i></div>${tilesHTML(i,{disabled:1})}${navHTML('<button class="btn" id="rv">Révéler maintenant</button>')}</div>`,'Animateur');
    hostLive();document.getElementById('rv').onclick=reveal;bindNav();timerRun(Q[i].t,live.startedAt,null);return;}
  if(ph==='reveal'){const i=live.q,cnt=[0,0,0,0];names.forEach(p=>{const x=p.a[i];if(x)cnt[x[0]]++;});const mx=Math.max(1,...cnt);
    shell(`<div class="card"><div class="qhead"><span class="pill">Question ${i+1} / ${Q.length}</span><span class="pill">Code ${code}</span></div><h2>${esc(Q[i].q)}</h2>${tilesHTML(i,{disabled:1,cls:k=>k===Q[i].c?'ok':'dim'})}<div class="dist">${cnt.map((c,k)=>`<div class="dbar"><b>${L[k]}</b><span class="t${k}" style="width:${Math.max(2,c/mx*100)}%"></span><span>${c}</span></div>`).join('')}</div><p class="verse">${esc(Q[i].v)}</p><h2 style="margin-top:20px">Classement</h2>${boardHTML(rows())}${navHTML(`<button class="btn" id="nx">${i+1<Q.length?'Question suivante':'Voir le podium'}</button>`)}</div>`,'Animateur');
    document.getElementById('nx').onclick=nextQ;bindNav();return;}
  if(ph==='end'){
    shell(`<div class="card"><h1>Podium</h1>${boardHTML(rows())}<p class="verse">« C'est bien, bon et fidèle serviteur ; tu as été fidèle en peu de chose, je te confierai beaucoup. » Matthieu 25:21</p><div class="row"><button class="btn" id="again">Recommencer avec les mêmes joueurs</button><button class="btn ghost" id="pv">← Dernière question</button><button class="btn ghost" id="hi">Historique</button><button class="btn ghost" id="qt">Retour à l'accueil</button></div></div>`,'Animateur');
    document.getElementById('again').onclick=restartGame;document.getElementById('hi').onclick=()=>showHistory(backToHost);bindNav();}
}

/* ================= PARTICIPANT ================= */
let ppeer=null,conn=null,me=store.get('quizlive')||{code:'',nick:''},st=null,recvAt=0,lastKey='',retry=0;
let myId=store.get('quizid');if(!myId){myId=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set('quizid',myId);}
let gen=0,retryT=null,openT=null,beatT=null,lastMsg=0,pend=null,rKey='',joined=false;
const ICE={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}};
function joinForm(err){
  view='player';clearInterval(tick);stopNet();joined=false;
  const c=params.get('code')||me.code||'';
  shell(`<div class="card"><h2>Rejoindre la partie</h2>${err?`<p class="err">${esc(err)}</p>`:''}<form id="jf"><label class="soft small" for="cd">Code affiché à l'écran</label><input id="cd" inputmode="numeric" maxlength="4" value="${esc(c)}" placeholder="1234"><label class="soft small" for="nk" style="display:block;margin-top:12px">Votre pseudo</label><input id="nk" maxlength="20" value="${esc(me.nick)}" placeholder="Ex. Emma" autocomplete="nickname"><div class="row" style="margin-top:16px"><button class="btn" type="submit">Rejoindre</button></div></form></div>`,'Participant');
  document.getElementById('jf').onsubmit=e=>{e.preventDefault();const cd=document.getElementById('cd').value.trim(),nk=document.getElementById('nk').value.trim().slice(0,20);if(!/^\d{4}$/.test(cd)){joinForm("Le code doit comporter 4 chiffres.");return;}if(!nk){joinForm("Choisissez un pseudo.");return;}me={code:cd,nick:nk,ts:Date.now()};store.set('quizlive',me);retry=0;joined=true;connect();};
}
function stopNet(){gen++;clearTimeout(retryT);clearTimeout(openT);clearInterval(beatT);try{if(conn)conn.close();}catch(e){}try{if(ppeer)ppeer.destroy();}catch(e){}conn=null;ppeer=null;}
function waitScreen(title,sub){if(st){setStatus(title);return;}shell(`<div class="card"><h2>${esc(title)}</h2><p class="soft">${esc(sub)}</p></div>`,'Participant');}
function connect(){
  stopNet();const g=gen;view='player';
  waitScreen(retry?'Reconnexion…':'Connexion…','Recherche de la partie '+me.code+'.');
  try{ppeer=new Peer({debug:1,...ICE});}catch(e){joinForm("Connexion impossible : vérifiez votre accès Internet.");return;}
  openT=setTimeout(()=>{if(g===gen)lost(g);},15000);
  ppeer.on('open',()=>{if(g!==gen)return;
    const c=ppeer.connect(PREFIX+me.code,{reliable:true,serialization:'json'});conn=c;
    c.on('open',()=>{if(g!==gen)return;clearTimeout(openT);retry=0;lastMsg=Date.now();c.send({t:'hello',n:me.nick,id:myId});
      clearInterval(beatT);beatT=setInterval(()=>{if(g!==gen)return;if(Date.now()-lastMsg>12000){lost(g);return;}try{c.send({t:'ping'});}catch(e){}},4000);});
    c.on('data',d=>{if(g!==gen)return;lastMsg=Date.now();onState(d);});
    c.on('close',()=>{if(g===gen)lost(g);});
    c.on('error',()=>{if(g===gen)lost(g);});});
  ppeer.on('disconnected',()=>{if(g!==gen)return;try{ppeer.reconnect();}catch(e){}});
  ppeer.on('error',e=>{if(g!==gen)return;if(e&&e.type==='peer-unavailable'){if(st){lost(g);}else{joinForm("Aucune partie avec ce code. Vérifiez le code affiché sur le grand écran.");}}else lost(g);});
}
function lost(g){
  if(g!==gen||view!=='player'||!joined)return;
  stopNet();retry++;
  if(retry>8){shell(`<div class="card"><h2>Connexion perdue</h2><p class="soft">Impossible de joindre la partie. Si vous êtes sur le Wi-Fi, essayez en 4G.</p><div class="row" style="margin-top:14px"><button class="btn" id="rt">Réessayer</button><button class="btn ghost" id="bk">Changer de code</button></div></div>`,'Participant');document.getElementById('rt').onclick=()=>{retry=0;connect();};document.getElementById('bk').onclick=()=>joinForm();return;}
  waitScreen('Reconnexion…','Tentative '+retry+' sur 8.');
  retryT=setTimeout(connect,Math.min(800*retry,4000));
}
function onState(d){
  if(!d||d.t!=='state')return;
  const key=d.phase+':'+d.q;if(key!==lastKey){lastKey=key;recvAt=Date.now();if(!(pend&&pend.q===d.q&&d.phase==='question'))pend=null;}
  if(d.name&&d.name!==me.nick){me.nick=String(d.name).slice(0,24);store.set('quizlive',{...me,ts:Date.now()});}
  if(d.mine)pend=null;
  if(pend&&d.phase==='question'&&d.q===pend.q&&!d.mine){try{conn&&conn.open&&conn.send({t:'ans',q:pend.q,c:pend.c,ms:pend.ms});}catch(e){}}
  st=d;
  const k=JSON.stringify([d.phase,d.q,!!(d.mine||pend),d.score,d.rank,d.count,me.nick]);
  if(k!==rKey){rKey=k;playerRender();}else setStatus('Participant');
}
function playerRender(){
  if(view!=='player'||!st)return;clearInterval(tick);
  const head=`<div class="qhead"><span class="pill">${esc(me.nick)}</span><span class="pill">${+st.score||0} pts</span></div>`,i=+st.q;
  if(st.phase==='closed'){joined=false;stopNet();shell(`<div class="card"><h2>Partie terminée</h2><p class="soft">L'animateur a fermé la partie. Merci d'avoir joué !</p><p class="verse">« C'est bien, bon et fidèle serviteur. » Matthieu 25:21</p><button class="btn ghost" id="bk">Rejoindre une autre partie</button></div>`,'Participant');document.getElementById('bk').onclick=()=>{st=null;rKey='';joinForm();};return;}
  if(st.phase==='lobby'){shell(`<div class="card">${head}<h2>Vous êtes inscrit !</h2><p class="soft">Regardez le grand écran : la partie va commencer.</p>${lamp}</div>`,'Participant');return;}
  if(!(i>=0&&i<Q.length))return;
  if(st.phase==='question'){
    if(st.mine||(pend&&pend.q===i)){shell(`<div class="card">${head}<h2>Réponse enregistrée</h2><p class="soft">${st.mine?'Attendez la révélation sur le grand écran.':'Envoi en cours…'}</p></div>`,'Participant');return;}
    shell(`<div class="card">${head}<div class="qhead"><span class="pill">Question ${i+1} / ${Q.length}</span><span class="pill" id="secs"></span></div><h2>${esc(Q[i].q)}</h2><div class="timer"><i id="bar"></i></div>${tilesHTML(i,{})}</div>`,'Participant');
    app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(st.mine||pend)return;const c=+b.dataset.i,ms=Date.now()-recvAt;pend={q:i,c,ms};try{conn&&conn.open&&conn.send({t:'ans',q:i,c,ms});}catch(e){}rKey='';playerRender();});
    timerRun(Q[i].t,recvAt,()=>{if(!st.mine&&!pend&&st.phase==='question'&&+st.q===i)shell(`<div class="card">${head}<h2>Temps écoulé</h2><p class="soft">Attendez la révélation sur le grand écran.</p></div>`,'Participant');});return;}
  if(st.phase==='reveal'){const ok=st.mine&&st.mine[0]===Q[i].c;
    shell(`<div class="card">${head}<p class="feedback ${ok?'good':'bad'}">${ok?`Bonne réponse ! +${pts(i,st.mine)}`:st.mine?'Pas tout à fait':'Pas de réponse'}</p><p>La bonne réponse : <b>${L[Q[i].c]} — ${esc(Q[i].a[Q[i].c])}</b></p><p class="verse">${esc(Q[i].v)}</p>${st.rank?`<p class="soft">Vous êtes ${rk(st.rank)} sur ${st.count}.</p>`:''}</div>`,'Participant');return;}
  if(st.phase==='end'){shell(`<div class="card hero"><div><h2>Partie terminée</h2><p class="big">${+st.score||0} pts</p>${st.rank?`<p>Classement final : ${rk(st.rank)} sur ${st.count}</p>`:''}<p class="verse">« C'est bien, bon et fidèle serviteur. » Matthieu 25:21</p></div>${lamp}</div>`,'Participant');}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view==='player'&&joined&&(!conn||!conn.open||Date.now()-lastMsg>8000)){retry=0;connect();}});

const pc=params.get('code');
if(pc){me.code=pc;if(me.nick&&store.get('quizlive')&&store.get('quizlive').code===pc&&Date.now()-(store.get('quizlive').ts||0)<3*3600e3){view='player';joined=true;connect();}else joinForm();}
else{intro();checkAdmin().then(ok=>{isAdmin=ok;if(view==='intro')intro();});}
}
</script>
</body>
